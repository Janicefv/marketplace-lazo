# Proxy inverso (entorno local / on-premise con Docker).
# Es la única puerta de entrada: sirve el frontend estático y reenvía /api al contenedor de la API,
# que no está expuesto al exterior. En producción en Vercel este papel lo cumple su Edge Network.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile      on;

  # Compresión de respuestas de texto
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Límite de peticiones por IP: general para la API y más estricto para registro/login
  limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  # Balanceo hacia una o más réplicas de la API
  upstream c2c_api {
    server api:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 5m;   # Igual al límite de Vercel (4,5 MB) para que ambos entornos se comporten igual

    # Cabeceras de seguridad para todo el sitio
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://res.cloudinary.com; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    # Capa de API: solo registro e inicio de sesión llevan el límite estricto
    # (/api/auth/me se consulta en cada página y va con el límite general).
    location = /api/auth/login {
      limit_req zone=auth burst=5 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_pass http://c2c_api;
    }

    location = /api/auth/register {
      limit_req zone=auth burst=5 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_pass http://c2c_api;
    }

    # Capa de API: resto de endpoints (^~ evita que la regla de estáticos capture rutas de la API)
    location ^~ /api/ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_pass http://c2c_api;
    }

    # Imágenes guardadas en disco por la API (solo desarrollo; en producción las sirve Cloudinary)
    location ^~ /uploads/ {
      include /etc/nginx/proxy.conf;
      proxy_pass http://c2c_api;
      expires 7d;
    }

    # Capa de presentación: archivos estáticos con caché
    location ~* \.(css|js|woff2|svg|jpg|jpeg|png|webp)$ {
      expires 1h;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }

  # En un servidor propio se agrega TLS (por ejemplo con Let's Encrypt):
  # server {
  #   listen 443 ssl http2;
  #   ssl_certificate     /etc/letsencrypt/live/tudominio/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/tudominio/privkey.pem;
  #   ... mismas location que arriba ...
  # }
}
