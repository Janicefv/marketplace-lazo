<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recibo de compra · Lazo</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/poppins-400.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/pages/confirmation.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/index.html"><img src="/img/logo.svg" alt="" width="34" height="34">Lazo</a>
      <form class="search" role="search" action="/index.html" method="get">
        <label class="visually-hidden" for="site-search">Buscar productos</label>
        <input id="site-search" name="search" type="search" maxlength="100" placeholder="Buscar bolsos, vestidos, velas…">
        <button class="button" type="submit">Buscar</button>
      </form>
      <nav class="header-actions" id="session-actions" aria-label="Cuenta"></nav>
    </div>
  </header>

  <main id="main">
    <div class="receipt-wrap">
      <p class="loading" id="loading">Confirmando el pago con la pasarela…</p>
      <div class="alert" id="page-alert" hidden></div>

      <div id="result" hidden>
        <div class="status" id="status" role="status">
          <div class="status__icon" id="status-icon" aria-hidden="true"></div>
          <h1 id="status-title"></h1>
          <p id="status-text"></p>
        </div>

        <section class="receipt" id="receipt" aria-labelledby="receipt-title">
          <h2 id="receipt-title">Recibo de compra</h2>
          <dl>
            <dt>Orden</dt><dd id="r-order"></dd>
            <dt>Fecha</dt><dd id="r-date"></dd>
            <dt>Producto</dt><dd id="r-product"></dd>
            <dt>Vendedor</dt><dd id="r-seller"></dd>
            <dt>Comprador</dt><dd id="r-buyer"></dd>
            <dt>Método de pago</dt><dd id="r-method"></dd>
            <dt>Referencia del pago</dt><dd id="r-payment"></dd>
            <dt>Entregar en</dt><dd id="r-address"></dd>
            <dt class="grand">Total</dt><dd class="grand" id="r-total"></dd>
          </dl>
        </section>

        <div class="receipt-actions" id="actions"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><p><span class="footer-mark" aria-hidden="true">♡</span> Lazo es un marketplace C2C: cada persona registrada puede comprar y vender.</p></footer>
</body>
</html>
