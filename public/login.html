<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Lazo</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/poppins-400.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/index.html"><img src="/img/logo.svg" alt="" width="34" height="34">Lazo</a>
      <form class="search" role="search" action="/index.html" method="get">
        <label class="visually-hidden" for="site-search">Buscar productos</label>
        <input id="site-search" name="search" type="search" maxlength="100" placeholder="Buscar bolsos, vestidos, velas…">
        <button class="button" type="submit">Buscar</button>
      </form>
      <nav class="header-actions" aria-label="Cuenta"><a href="/registro.html">Crear cuenta</a></nav>
    </div>
  </header>

  <main id="main">
    <div class="form-page">
      <h1>Ingresa a tu cuenta</h1>
      <p class="lead">Para comprar o publicar necesitas iniciar sesión.</p>

      <form class="panel" id="login-form" novalidate>
        <div class="alert" id="form-alert" hidden></div>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <p class="field-error" id="email-error"></p>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error">
          <p class="field-error" id="password-error"></p>
        </div>
        <button class="button button--block button--large" type="submit" id="submit">Ingresar</button>
        <p class="form-footer">¿No tienes cuenta? <a href="/registro.html" id="register-link">Crea una</a></p>
      </form>
    </div>
  </main>

  <footer class="site-footer"><p><span class="footer-mark" aria-hidden="true">♡</span> Lazo es un marketplace C2C: cada persona registrada puede comprar y vender.</p></footer>
</body>
</html>
