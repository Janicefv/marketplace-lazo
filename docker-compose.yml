# Entorno completo en local: proxy inverso (Nginx) -> API (Node) -> PostgreSQL.
# Uso: docker compose up --build   y abrir http://localhost:8080
services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/c2c
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-local-de-32-caracteres-o-mas}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
      APP_URL: http://localhost:8080
    expose:
      - "3000"          # Sin "ports": la API solo es accesible a través del proxy
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: c2c
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d c2c"]
      interval: 5s
      retries: 10

volumes:
  db-data:
  uploads:
